name: BUILD APK NEW Automatic

on:
  push:                # no branches filter — runs on push to any branch
  pull_request:        # runs on PRs targeting any branch
  workflow_dispatch:   # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install
        env:
          SKIP_ONENOTE_CONVERTER_BUILD: 1

      - name: Build dependencies
        run: yarn workspace @joplin/lib run build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x packages/app-mobile/android/gradlew

      - name: Build (assembleRelease) using wrapper
        working-directory: packages/app-mobile/android
        run: |
          sed -i -- 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
          ./gradlew assembleRelease

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: packages/app-mobile/android/app/build/outputs/apk/release/*.apk
