name: BUILD APK NEW Automatic

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Restore missing gradlew file
      run: |
        cd packages/app-android
        if [ ! -f "gradlew" ]; then
          echo "gradlew is missing! Downloading it automatically..."
          curl -sLO https://raw.githubusercontent.com/laurent22/joplin/dev/packages/app-android/gradlew
          curl -sLO https://raw.githubusercontent.com/laurent22/joplin/dev/packages/app-android/gradlew.bat
          mkdir -p gradle/wrapper
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/laurent22/joplin/dev/packages/app-android/gradle/wrapper/gradle-wrapper.jar
          curl -sLo gradle/wrapper/gradle-wrapper.properties https://raw.githubusercontent.com/laurent22/joplin/dev/packages/app-android/gradle/wrapper/gradle-wrapper.properties
        fi
        chmod +x gradlew
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Yarn
      run: npm install -g yarn

    - name: Install Dependencies
      run: yarn install

    - name: Build Android APK
      working-directory: packages/app-android
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: joplin-apk
        path: packages/app-android/app/build/outputs/apk/release/*.apk
        retention-days: 7
