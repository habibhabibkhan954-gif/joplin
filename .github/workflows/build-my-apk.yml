name: BUILD APK NEW Automatic

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for submodules

    - name: Verify gradlew exists
      run: |
        echo "Checking if gradlew exists..."
        if [ ! -f "packages/app-android/gradlew" ]; then
          echo "❌ gradlew not found! Creating it..."
          cd packages/app-android
          # Download gradle wrapper if missing
          gradle wrapper --gradle-version 7.6
          cd ../..
        else
          echo "✅ gradlew found!"
        fi
        ls -la packages/app-android/gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Yarn
      run: npm install -g yarn

    - name: Install Dependencies
      run: yarn install

    - name: Make gradlew executable
      run: chmod +x packages/app-android/gradlew

    - name: Build Android APK
      working-directory: packages/app-android
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: joplin-apk
        path: packages/app-android/app/build/outputs/apk/release/*.apk
        retention-days: 7
